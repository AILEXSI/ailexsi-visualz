<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>AILEXSI Visualz — live demo</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #07070c; font: 14px/1.4 ui-sans-serif, system-ui; color: #eee; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; left: 16px; bottom: 16px; z-index: 2;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: rgba(8,8,14,.72); padding: 10px 12px; border-radius: 12px;
      backdrop-filter: blur(12px);
    }
    button, select, label {
      background: #161622; color: #fff; border: 1px solid #2a2a3a;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
  </style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <label>Track <input id="file" type="file" accept="audio/*" /></label>
  <button id="play">Play</button>
  <select id="scene">
    <option value="aurora">aurora-ribbon</option>
    <option value="wave">resonance-wave</option>
    <option value="sun">kick-sun</option>
    <option value="bars">spectrum</option>
  </select>
  <span id="info">MP3 wählen — Visualz live</span>
</div>
<script type="module">
const canvas = document.getElementById("stage");
const file = document.getElementById("file");
const playBtn = document.getElementById("play");
const sceneSel = document.getElementById("scene");
const info = document.getElementById("info");
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
}
addEventListener("resize", resize); resize();
const ctx = canvas.getContext("2d");
let audioCtx, analyser, srcNode, audio, raf, phase = 0;
const freq = new Uint8Array(1024);
const time = new Uint8Array(2048);
let prevE = 0, pulse = 0;
function features() {
  if (!analyser) return { rms: 0, bass: 0, mid: 0, treble: 0, spec: new Float32Array(64), pulse: 0 };
  analyser.getByteFrequencyData(freq);
  analyser.getByteTimeDomainData(time);
  let ss = 0;
  for (let i = 0; i < time.length; i++) { const v = (time[i] - 128) / 128; ss += v * v; }
  const rms = Math.min(1, Math.sqrt(ss / time.length) * 2.2);
  const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += freq[i]; return s / Math.max(1, (b - a) * 255); };
  const bass = avg(0, 24), mid = avg(24, 120), treble = avg(120, freq.length);
  const spec = new Float32Array(96);
  for (let i = 0; i < 96; i++) {
    const idx = Math.floor(Math.pow(i / 95, 1.65) * (freq.length - 1));
    spec[i] = freq[idx] / 255;
  }
  const e = rms * 0.5 + bass * 0.5;
  const onset = e - prevE > 0.08;
  prevE = e * 0.7 + prevE * 0.3;
  pulse = onset ? 1 : Math.max(0, pulse - 0.045);
  return { rms, bass, mid, treble, spec, pulse };
}
function musicDt(energy, pulse) {
  const g = Math.min(1, energy * 1.35 + pulse * 0.45);
  return 0.016 * (g < 0.03 ? 0.02 : g);
}
function hexA(hex, a) {
  const n = parseInt(hex.replace("#", ""), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function draw() {
  raf = requestAnimationFrame(draw);
  const f = features();
  const w = canvas.width, h = canvas.height;
  const energy = f.rms * 0.45 + f.bass * 0.35 + f.mid * 0.2;
  phase += musicDt(energy, f.pulse);
  ctx.fillStyle = "rgba(7,7,12,0.18)";
  ctx.fillRect(0, 0, w, h);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const mode = sceneSel.value;
  const cx = w / 2, cy = h / 2;
  const col = mode === "sun" ? "#ffb347" : mode === "bars" ? "#00e5a8" : "#ff8a4c";
  if (mode === "bars") {
    const n = 64, midY = h / 2, gap = 2, bw = (w - gap * n) / n;
    for (let i = 0; i < n; i++) {
      const v = Math.pow(f.spec[Math.floor(i / n * f.spec.length)] || 0, 0.72);
      const bh = v * h * 0.42, x = i * (bw + gap);
      const g = ctx.createLinearGradient(x, midY - bh, x, midY + bh);
      g.addColorStop(0, col); g.addColorStop(0.5, "#fff"); g.addColorStop(1, col);
      ctx.fillStyle = g;
      ctx.fillRect(x, midY - bh, bw, bh);
      ctx.globalAlpha = 0.4; ctx.fillRect(x, midY, bw, bh); ctx.globalAlpha = 1;
    }
  } else if (mode === "sun") {
    const reach = Math.min(w, h) * (0.2 + f.bass * 0.3 + f.pulse * 0.12);
    for (let i = 0; i < 28; i++) {
      const a = phase * 0.4 + (i / 28) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * reach * 0.25, cy + Math.sin(a) * reach * 0.25);
      ctx.lineTo(cx + Math.cos(a) * reach, cy + Math.sin(a) * reach);
      ctx.strokeStyle = hexA(col, 0.1 + energy * 0.3);
      ctx.lineWidth = 2 + f.pulse * 3; ctx.stroke();
    }
    const r = 18 + f.bass * 40 + f.pulse * 16;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.6);
    g.addColorStop(0, "rgba(255,255,255,0.95)");
    g.addColorStop(0.25, hexA(col, 0.7));
    g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 2.6, 0, Math.PI * 2); ctx.fill();
  } else {
    const layers = mode === "wave" ? 5 : 7;
    for (let r = 0; r < layers; r++) {
      ctx.beginPath();
      const yOff = (r - (layers - 1) / 2) * h * 0.04;
      for (let x = 0; x <= w; x += 3) {
        const t = x / w;
        const spec = f.spec[Math.floor(t * (f.spec.length - 1))] || 0;
        const amp = (0.05 + energy * 0.16 + spec * 0.2) * h;
        const y = cy + yOff + Math.sin(t * Math.PI * 2.4 + phase * 0.7 + r * 0.3) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = hexA(col, (0.22 - r * 0.02) * (0.35 + energy));
      ctx.lineWidth = 1.5 + (layers - r) * 0.35; ctx.stroke();
    }
    const core = 10 + f.bass * 28 + f.pulse * 14;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 3);
    g.addColorStop(0, "rgba(255,255,255,0.9)");
    g.addColorStop(0.3, hexA(col, 0.55));
    g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, core * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.filter = `blur(${8 + f.pulse * 10}px)`;
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = 0.28 + energy * 0.25;
  ctx.drawImage(canvas, 0, 0);
  ctx.restore();
}
async function hookFile(f) {
  audio?.pause(); audioCtx?.close();
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.55;
  audio = new Audio(); audio.src = URL.createObjectURL(f); audio.loop = true;
  srcNode = audioCtx.createMediaElementSource(audio);
  srcNode.connect(analyser); analyser.connect(audioCtx.destination);
  info.textContent = f.name;
}
file.addEventListener("change", () => { const f = file.files?.[0]; if (f) hookFile(f); });
playBtn.addEventListener("click", async () => {
  if (!audio) { info.textContent = "Erst MP3 wählen"; return; }
  if (audioCtx.state === "suspended") await audioCtx.resume();
  if (audio.paused) { await audio.play(); playBtn.textContent = "Pause"; }
  else { audio.pause(); playBtn.textContent = "Play"; }
});
requestAnimationFrame(draw);
</script>
</body>
</html>
